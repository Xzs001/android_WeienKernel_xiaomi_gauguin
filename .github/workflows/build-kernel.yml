name: Build Xiaomi Gauguin Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Up Disk Space Manually
        run: |
          echo "=== 清理前的磁盘空间 ==="
          df -h
          
          echo "=== 正在暴力清理虚拟机中的巨无霸无用软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          
          sudo apt-get purge -y '^dotnet-' '^ghc-' 'google-chrome-*' 'firefox' 'powershell' 'openjdk-*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          echo "=== 清理后的磁盘空间 ==="
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone Toolchains
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ../clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git ../gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git ../gcc32

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/TheWeienKernelProject/android_WeienKernel_xiaomi_gauguin.git kernel_source

      - name: Fix Missing rekernel Kconfig Dependency
        run: |
          cd kernel_source
          # 如果 drivers/Kconfig 里面引用了 missing 的 rekernel，直接将其安全注释掉或删除
          if [ -f "drivers/Kconfig" ]; then
            sed -i '/rekernel/d' drivers/Kconfig || true
          fi

      - name: Build Kernel
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/../clang/bin:$GITHUB_WORKSPACE/../gcc64/bin:$GITHUB_WORKSPACE/../gcc32/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/lito-perf_defconfig vendor/xiaomi/gauguin.config || make O=out ARCH=arm64 vendor/lito_defconfig

          make -j8 O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ../AnyKernel3
          
          sed -i 's/device\.name1 = .*/device.name1 = gauguin;/g' ../
